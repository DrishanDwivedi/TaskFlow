---
- name: Configure Taskflow Server
  hosts: servers
  become: yes

  tasks:

    - name: APT update
      apt:
        update_cache: yes
        cache_valid_time: 3000

    - name: Install required packages
      apt:
        name:
        - docker.io
        - docker-compose-plugin
        - git
        state: present
    
    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes
    - name: Add remote user to docker group
      user: 
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
