name: Taskflow-CD

on:
    workflow_run:
        workflows: ["Taskflow-CI"]
        types:
            - completed

jobs:
    deploy:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ubuntu
                key: ${{ secrets.EC2_SSH_KEY }}
                script: |
                    if [ ! -d /opt/taskflow/.git ]; then
                        sudo git clone https://github.com/DrishanDwivedi/TaskFlow.git /opt/taskflow
                    else
                        cd /opt/taskflow
                        sudo git pull origin main
                    fi

                    cd /opt/taskflow
                    sudo docker compose pull
                    sudo docker compose up -d